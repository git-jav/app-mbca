<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ea3f41">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MyEdenred</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body>
  <img id="picture" src="image.png" alt="MyEdenred welcome screen">
  <audio id="sound" src="crop.mp3" preload="auto"></audio>
  <script>
    const picture = document.getElementById("picture");
    const sound = document.getElementById("sound");

    picture.addEventListener("click", () => {
      if (sound.paused && !sound.ended) {
        sound.play().catch((error) => {
          console.error("Unable to play the sound:", error);
        });
      } else if (sound.ended) {
        sound.currentTime = 0;
        sound.play().catch((error) => {
          console.error("Unable to replay the sound:", error);
        });
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch((error) => {
          console.error("Unable to register the service worker:", error);
        });
      });
    }
  </script>
</body>
</html>
