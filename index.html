<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MyEdenred</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body>
  <img id="picture" src="image.png" alt="MyEdenred welcome screen">
  <audio id="sound" src="crop.mp3" preload="auto"></audio>
  <script>
    const picture = document.getElementById("picture");
    const sound = document.getElementById("sound");

    picture.addEventListener("click", () => {
      if (sound.paused && !sound.ended) {
        sound.play().catch((error) => {
          console.error("Unable to play the sound:", error);
        });
      } else if (sound.ended) {
        sound.currentTime = 0;
        sound.play().catch((error) => {
          console.error("Unable to replay the sound:", error);
        });
      }
    });
  </script>
</body>
</html>
