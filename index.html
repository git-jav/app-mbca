<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ea3f41">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MyEdenred</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #ea3f41;
      touch-action: none;
    }

    img {
      position: fixed;
      top: calc(-1 * env(safe-area-inset-top, 0px));
      right: calc(-1 * env(safe-area-inset-right, 0px));
      bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
      left: calc(-1 * env(safe-area-inset-left, 0px));
      width: calc(100vw + env(safe-area-inset-left, 0px) + env(safe-area-inset-right, 0px));
      height: calc(100dvh + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px));
      object-fit: cover;
      object-position: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <img id="picture" src="image.png" alt="MyEdenred welcome screen" draggable="false">
  <audio id="sound" src="crop.mp3" preload="auto"></audio>
  <script>
    const picture = document.getElementById("picture");
    const sound = document.getElementById("sound");

    picture.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });

    picture.addEventListener("click", () => {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch((error) => {
          console.error("Unable to enter full-screen mode:", error);
        });
      }

      if (sound.paused && !sound.ended) {
        sound.play().catch((error) => {
          console.error("Unable to play the sound:", error);
        });
      } else if (sound.ended) {
        sound.currentTime = 0;
        sound.play().catch((error) => {
          console.error("Unable to replay the sound:", error);
        });
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch((error) => {
          console.error("Unable to register the service worker:", error);
        });
      });
    }
  </script>
</body>
</html>
